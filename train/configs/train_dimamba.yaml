# Bidirectional Mamba-2; match the corresponding CrossDiT configuration.
train_dir: data/train
val_dir: data/test

epochs: 50
batch_size: 8
lr: 0.0001
latent_scale: 1.335256
sample_steps: 50

model: DiMamba
size: L               # S, B, L, XL
use_seq_compression: false
use_global_cond: true
grad_cp: true

cfg_scale: 1.0
warmup_steps: 0
precision: fp16

vae_ckpt: null  # Supply the selected epoch_XXX.pt here or with --vae_ckpt.
save_dir: checkpoints/dit/DiMamba-L
run_name: DiMamba-L
